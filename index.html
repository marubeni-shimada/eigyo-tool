<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>営業管理システム</title>
<style>html,body{margin:0;height:100%;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#16241c}
#_ld{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfe}
.sp{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#39b488;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div id="_ld"><div class="sp"></div><div style="margin-top:12px;font-size:13px">読み込み中…</div></div>
<script>
/* 常に最新のapp.htmlを取得して表示（キャッシュを使わない）。更新はapp.htmlを貼り替えるだけ。 */
(function(){
  function load(n){
    fetch('app.html?t='+Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(html){ document.open(); document.write(html); document.close(); })
      .catch(function(e){
        if(n<3){ setTimeout(function(){ load(n+1); }, 800*(n+1)); return; }
        document.getElementById('_ld').innerHTML='<div style="color:#fff;font-size:13px">読み込みに失敗しました。<br>通信状況を確認して、もう一度開いてください。</div>';
      });
  }
  load(0);
})();
</script>
</body>
</html>
